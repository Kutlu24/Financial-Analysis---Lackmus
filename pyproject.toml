[project]
name = "lackmus"
version = "0.1.0"
description = "Backend for Financial Compass (Lackmus): extracts balance-sheet fields from an uploaded PDF or image so the existing client-side ratio calculator can run on them"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "google-genai>=1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
